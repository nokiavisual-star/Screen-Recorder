name: Build CapTure.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build CapTure.exe
        run: pyinstaller capture.spec --clean --noconfirm

      - name: Smoke test
        shell: powershell
        run: |
          $p = Start-Process -FilePath ".\\dist\\CapTure.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content -Path ".\dist\CapTure_error.log" -ErrorAction SilentlyContinue
            Write-Error "Smoke test failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapTure
          path: dist/CapTure.exe
